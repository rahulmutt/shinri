[bans]
# Native-link dependencies are forbidden in the shipping build (pure-Rust mandate).
deny = [
    { name = "rug" },
    { name = "gmp-mpfr-sys" },
    { name = "z3-sys" },
    { name = "cadical-rs" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "BSD-3-Clause"]
