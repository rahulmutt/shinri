[tools]
rust = { version = "1.98.1", components = "rustfmt,clippy" }
"cargo:cargo-nextest" = "0.9.144"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-fuzz" = "0.13.2"
"cargo:cargo-mutants" = "27.1.0"
gitleaks = "8.30.1"
"github:Z3Prover/z3" = { version = "z3-4.16.0", exe = "z3", matching = "x64-glibc" }
"github:cvc5/cvc5" = { version = "cvc5-1.3.4", exe = "cvc5", matching = "x86_64-static.zip" }

[tasks.lint]
description = "rustfmt check + clippy (deny warnings)"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
]

[tasks.deny]
description = "Dependency policy: bans, advisories, licenses (cargo-deny)"
run = "cargo deny check"

[tasks.secrets]
description = "Secret scan of the working tree (gitleaks)"
run = "gitleaks dir . --no-banner --redact"

[tasks.secrets-staged]
description = "Secret scan of staged changes only (pre-commit hook body)"
run = "gitleaks git --pre-commit --staged --no-banner --redact"

[tasks.test]
description = "Fast test suite — skips #[ignore]d slow tests (blocking CI tier)"
run = "cargo nextest run --all"

[tasks.test-full]
description = "Full test suite — includes #[ignore]d exhaustive/slow tests (nightly tier)"
run = "cargo nextest run --all --run-ignored all"

[tasks.test-exhaustive]
description = "One #[ignore]d exhaustive shinri-fp test, named via EXHAUSTIVE_TEST (nightly CI matrix helper)"
run = "cargo nextest run -p shinri-fp --run-ignored only -E \"test($EXHAUSTIVE_TEST)\""

[tasks.test-full-rest]
description = "Full suite minus the five exhaustive shinri-fp tests (they run as a nightly CI matrix)"
run = "cargo nextest run --all --run-ignored all -E 'not (test(fp_div_tiny_exhaustive_all_modes) + test(fp_mul_tiny_exhaustive_all_modes) + test(fp_add_tiny_exhaustive_all_modes) + test(to_fp_fp_tiny_exhaustive_both_directions) + test(rem_tiny_exhaustive))'"

[tasks.fuzz-smoke]
description = "Short libFuzzer budget per fuzz target (nightly rustc via mise); FUZZ_SECONDS overrides 60s"
shell = "bash -c"
run = """
set -euo pipefail
for spec in shinri-num:integer_ops shinri-theory:classify shinri-sat:dimacs_parse shinri-sat:cnf_vs_oracle shinri-parser:parse_script; do
  crate="${spec%%:*}"; target="${spec##*:}"
  echo "== fuzz $crate/$target =="
  (cd "crates/$crate" && mise x rust@nightly -- cargo fuzz run "$target" -- -max_total_time="${FUZZ_SECONDS:-60}")
done
"""

[tasks.mutants]
description = "Mutation-test one crate (cargo-mutants); pick it via MUTANTS_PACKAGE, e.g. MUTANTS_PACKAGE=shinri-num mise run mutants"
run = "mkdir -p target/mutants && cargo mutants --package \"$MUTANTS_PACKAGE\" --timeout 300 --output target/mutants"

[tasks.bench-fetch]
description = "Download + verify + extract the pinned SMT-LIB 2024 archives into bench/corpus (BENCH_LOGICS=A,B to subset; BENCH_MIRROR for a local mirror)"
shell = "bash -c"
run = "cargo run --release -p shinri-bench -- fetch ${BENCH_LOGICS:+--logics $BENCH_LOGICS} ${BENCH_MIRROR:+--mirror $BENCH_MIRROR}"

[tasks.bench-run]
description = "Run shinri over bench/corpus under limits (BENCH_LOGICS, BENCH_TIMEOUT=20, BENCH_MEM_MB=3072, BENCH_JOBS=6, BENCH_RUN_ID)"
shell = "bash -c"
run = [
  "cargo build --release -p shinri-cli -p shinri-bench",
  "target/release/shinri-bench run ${BENCH_LOGICS:+--logics $BENCH_LOGICS} --timeout ${BENCH_TIMEOUT:-20} --mem-mb ${BENCH_MEM_MB:-3072} --jobs ${BENCH_JOBS:-6} ${BENCH_RUN_ID:+--run-id $BENCH_RUN_ID}",
]

[tasks.bench-report]
description = "Render bench/results/$BENCH_RUN_ID/report.md"
shell = "bash -c"
run = "cargo run --release -p shinri-bench -- report bench/results/$BENCH_RUN_ID"

[tasks.ci]
description = "Everything the blocking CI tier runs: lint, deny, secrets, test"
depends = ["lint", "deny", "secrets", "test"]
