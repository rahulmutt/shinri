name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * *' # nightly full/differential/fuzz budget
  workflow_dispatch: # on-demand run of the nightly-tier job
permissions:
  contents: read
jobs:
  # Blocking tier — budget 10–15 min wall-clock, hard-capped below.
  # Any test >5 min belongs in the nightly tier via #[ignore] (see AGENTS.md).
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4 # single source of toolchain+tools: mise.toml
        env:
          GITHUB_TOKEN: ${{ github.token }} # mise github backend → avoid API rate limits resolving z3/cvc5 releases
      - uses: Swatinem/rust-cache@v2
      - name: Lint
        run: mise run lint
      - name: Dependency policy
        run: mise run deny
      - name: Secret scan
        run: mise run secrets
      - name: Tests (fast tier)
        run: mise run test

  # Nightly tier — fanned out across parallel jobs so wall-clock ≈ the slowest
  # single test (~55 min div exhaustive) instead of the ~2 h serial chain.
  # One job per exhaustive #[ignore]d shinri-fp test (the >5 min suites).
  exhaustive:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        test:
          - fp_div_tiny_exhaustive_all_modes
          - fp_mul_tiny_exhaustive_all_modes
          - fp_add_tiny_exhaustive_all_modes
          - to_fp_fp_tiny_exhaustive_both_directions
          - rem_tiny_exhaustive
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: Swatinem/rust-cache@v2
      - name: Exhaustive test (nightly tier)
        run: mise run test-exhaustive
        env:
          EXHAUSTIVE_TEST: ${{ matrix.test }}

  # Everything else in the full suite (incl. the other #[ignore]d tests),
  # plus the extended property runs (seconds at 4000 cases).
  differential:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: Swatinem/rust-cache@v2
      - name: Full test suite minus the exhaustive matrix
        run: mise run test-full-rest
      - name: Extended differential (more cases)
        run: cargo nextest run -p shinri-sat --test oracle
        env:
          PROPTEST_CASES: '4000'
      - name: shinri-theory extended props (more cases)
        run: cargo nextest run -p shinri-theory --test props
        env:
          PROPTEST_CASES: '4000'

  oracle:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: Swatinem/rust-cache@v2
      - name: z3/cvc5 differential oracle suite
        run: cargo nextest run -p shinri-solver --features oracle
      - name: QF_S enumeration fuzzer (E1, differential vs z3)
        # #[ignore]d + oracle-gated, so it runs in no other tier; vetted at the
        # default 4000 iters (~3 min). Targeted --run-ignored only keeps the
        # other ignored tests (lia_e2e runs in the differential job) single-run.
        run: cargo nextest run -p shinri-solver --features oracle --run-ignored only -E 'test(e1_enumerate_wrong_verdicts)'

  fuzz:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: Swatinem/rust-cache@v2
      - name: Fuzz smoke (60s per target)
        run: mise run fuzz-smoke

  # Mutation audit — one crate per night, rotated by day-of-year (full
  # 15-crate cycle ≈ every two weeks). Report-only for now: missed mutants
  # (exit 2) and timeouts (exit 3) surface via the mutants.out artifact,
  # not a red job — a first pass over an unaudited suite would pin the
  # nightly red permanently. Baseline/usage failures (other codes) still
  # fail. Revisit fail-on-regression once a baseline exists.
  mutants:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: Swatinem/rust-cache@v2
      - name: Pick tonight's crate (day-of-year rotation)
        id: pick
        run: |
          crates=(shinri-num shinri-core shinri-frontend shinri-sat shinri-theory shinri-euf shinri-solver shinri-arith shinri-parser shinri-cli shinri-arrays shinri-bv shinri-abv shinri-str shinri-fp)
          idx=$(( 10#$(date -u +%j) % ${#crates[@]} ))
          echo "crate=${crates[$idx]}" >> "$GITHUB_OUTPUT"
          echo "Tonight's crate: ${crates[$idx]}"
      - name: Mutation-test ${{ steps.pick.outputs.crate }}
        run: |
          set +e
          MUTANTS_PACKAGE='${{ steps.pick.outputs.crate }}' mise run mutants
          code=$?
          case "$code" in
            0|2|3) exit 0 ;;  # clean / missed mutants / timeouts: report-only
            *) exit "$code" ;;
          esac
      - name: Upload mutants.out
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-${{ steps.pick.outputs.crate }}
          path: target/mutants/mutants.out
